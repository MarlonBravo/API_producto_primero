<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Productos</h2>
    <button class="btn btn-success" (click)="createProduct()" *ngIf="authService.isAuthenticated()">Crear Producto</button>
    <button class="btn btn-outline-secondary" (click)="logout()" *ngIf="authService.isAuthenticated()">Cerrar Sesión</button>
  </div>

 <div class="card mt-4" *ngIf="!authService.isAuthenticated()">
  <div class="card-body text-center">
    <h5 class="card-title">🔒 Acceso restringido</h5>
    <p class="card-text">Debes iniciar sesión para ver los productos.</p>
    <a routerLink="/login" class="btn btn-primary">Iniciar Sesión</a>
  </div>
</div>

  <div class="row" *ngIf="authService.isAuthenticated()">
    <div class="col-md-6 mb-3" *ngFor="let product of products">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <p class="text-muted">Precio: ${{ product.price }}</p>
          <button class="btn btn-sm btn-primary me-2" (click)="editProduct(product)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="deleteProduct(product._id)">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
